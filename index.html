<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yalith Salón · Cancún</title>
<meta name="description" content="Uñas y pestañas en Cancún. Agenda tu cita por WhatsApp.">
<meta name="theme-color" content="#0D0A0B">
<!-- Vista previa al compartir (ver LEEME.md, paso 5). PENDIENTE: pon tu enlace real y activa las dos líneas siguientes -->
<meta property="og:type" content="website">
<meta property="og:title" content="Yalith Salón · Cancún">
<meta property="og:description" content="Uñas y pestañas en Cancún. Agenda tu cita por WhatsApp.">
<meta property="og:locale" content="es_MX">
<!-- <meta property="og:url" content="PENDIENTE DE CONFIGURAR"> -->
<!-- <meta property="og:image" content="PENDIENTE DE CONFIGURAR"> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--negro:#0D0A0B;--carbon:#1A1315;--carbon2:#261A1E;--rosa:#F2B8C6;--rosa-suave:#F7D3DB;--oro:#C9A24D;--oro-claro:#E8C77A;--texto:#F6E9E4;--suave:#CDB7B1;--linea:rgba(201,162,77,.45)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Jost,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--negro);color:var(--texto);line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;line-height:1.1}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--oro-claro);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.aviso{background:var(--rosa);color:var(--negro);font-size:.85rem;padding:10px 16px;display:flex;gap:12px;align-items:flex-start}
.aviso button{margin-left:auto;background:none;border:1px solid var(--negro);color:var(--negro);border-radius:999px;padding:2px 12px;font:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.portada img{width:100%;max-width:560px;margin:0 auto;aspect-ratio:3/2;object-fit:cover;border-radius:0 0 40px 40px}
.centro{text-align:center;padding-top:26px}
.hero h1{font-size:clamp(2.6rem,12vw,3.6rem);font-style:italic;color:var(--rosa)}
.frase{color:var(--rosa-suave);font-size:1.1rem;max-width:30ch;margin:0 auto}
.ciudad{color:var(--oro-claro);font-size:.95rem;margin-top:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px 22px;border-radius:999px;background:linear-gradient(135deg,#EBCB84,#C9A24D);color:var(--negro);font-weight:600;font-size:1.08rem;border:0;cursor:pointer;font-family:inherit;box-shadow:0 6px 22px rgba(201,162,77,.3)}
.btn:active{transform:translateY(1px)}
#cta{margin-top:22px}
.redes{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:22px}
.red{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.66rem;color:var(--suave);background:none;border:0;font-family:inherit;cursor:pointer;min-width:0}
.red span.c{width:46px;height:46px;border-radius:50%;border:1px solid var(--oro);display:grid;place-items:center;color:var(--oro-claro);background:var(--carbon)}
.red b{font-weight:400;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

section{padding:56px 0 0}
h2{font-size:2.3rem;font-style:italic;color:var(--rosa);text-align:center}
h2::after{content:"";display:block;width:44px;height:1px;background:var(--oro);margin:12px auto 0}
.sub{color:var(--suave);text-align:center;margin:12px 0 10px}

.sv{display:flex;gap:14px;align-items:flex-start;padding:20px 0;border-bottom:1px dotted var(--linea)}
.sv img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:1px solid var(--oro);flex:none}
.in{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sv h3{font-size:1.6rem;color:var(--texto)}
.pr{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.55rem;color:var(--oro-claro);white-space:nowrap}
.pr.sin{font-size:1rem;font-style:italic;color:var(--suave)}
.sv p{color:var(--suave);font-size:.95rem;margin-top:4px}
.go{display:inline-block;margin-top:8px;color:var(--rosa);font-size:.9rem;font-weight:500}

.carrusel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:22px -20px 0;padding:0 20px 4px;-webkit-overflow-scrolling:touch}
.g{flex:0 0 68%;aspect-ratio:4/5;scroll-snap-align:center;border:1px solid var(--oro);padding:0;border-radius:999px 999px 18px 18px;overflow:hidden;background:var(--carbon2);cursor:pointer}
.g img{width:100%;height:100%;object-fit:cover}
dialog{border:0;background:transparent;max-width:96vw;max-height:92vh;padding:0}
dialog::backdrop{background:rgba(0,0,0,.9)}
dialog img{max-height:86vh;border-radius:14px;margin:auto}
dialog button{display:block;margin:10px auto 0;background:var(--carbon);color:var(--texto);border:1px solid var(--linea);border-radius:999px;padding:8px 22px;font:inherit;cursor:pointer}

.ubic{background:var(--carbon);border:1px solid var(--linea);border-radius:24px;padding:24px;text-align:center;margin-top:22px}
.ubic p{margin-bottom:18px}
.cierre{background:var(--carbon2);border-radius:28px;padding:30px 22px;text-align:center;margin-top:56px;border:1px solid var(--linea)}
.cierre h2::after{display:none}
.cierre p{color:var(--suave);margin:10px 0 20px}
footer{text-align:center;color:var(--suave);font-size:.85rem;padding:30px 0 10px}

.barra{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(13,10,11,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--linea);z-index:5;transform:translateY(110%);transition:transform .3s ease}
.barra.ver{transform:none}
.barra .btn{max-width:528px;margin:0 auto}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--rosa);color:var(--negro);padding:10px 18px;border-radius:999px;font-size:.9rem;z-index:9;max-width:90vw;text-align:center}
.toast[hidden]{display:none}
@media(min-width:700px){.carrusel{margin:22px 0 0;padding:0 0 4px}.g{flex-basis:46%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-wa" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></symbol>
<symbol id="i-tel" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></symbol>
<symbol id="i-ig" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></symbol>
<symbol id="i-fb" viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></symbol>
<symbol id="i-sh" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></symbol>
</svg>

<div id="aviso" class="aviso" hidden></div>

<header class="hero">
  <div class="portada" id="marca"></div>
  <div class="wrap centro">
    <h1 id="nombre"></h1>
    <p class="frase" id="frase"></p>
    <p class="ciudad" id="ciudad"></p>
    <a class="btn" id="cta" data-wa><svg class="i"><use href="#i-wa"/></svg>Agendar cita</a>
    <nav class="redes" aria-label="Contacto rápido">
      <a class="red" data-wa><span class="c"><svg class="i"><use href="#i-wa"/></svg></span><b>WhatsApp</b></a>
      <a class="red" id="llamar"><span class="c"><svg class="i"><use href="#i-tel"/></svg></span><b>Llamar</b></a>
      <a class="red" id="instagram" target="_blank" rel="noopener"><span class="c"><svg class="i"><use href="#i-ig"/></svg></span><b>Instagram</b></a>
      <a class="red" id="facebook" target="_blank" rel="noopener"><span class="c"><svg class="i"><use href="#i-fb"/></svg></span><b>Facebook</b></a>
      <a class="red" data-mapa target="_blank" rel="noopener"><span class="c"><svg class="i"><use href="#i-pin"/></svg></span><b>Ubicación</b></a>
      <button class="red" id="compartir" type="button"><span class="c"><svg class="i"><use href="#i-sh"/></svg></span><b>Compartir</b></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="servicios" aria-labelledby="t-serv">
    <h2 id="t-serv">Servicios</h2>
    <p class="sub">Toca el que te interesa y escríbenos por WhatsApp.</p>
    <div id="lista-servicios"></div>
  </section>

  <section id="galeria" aria-labelledby="t-gal" hidden>
    <h2 id="t-gal">Nuestro trabajo</h2>
    <div class="carrusel" id="lista-galeria"></div>
  </section>

  <section id="ubicacion" aria-labelledby="t-ubi">
    <h2 id="t-ubi">Visítanos</h2>
    <div class="ubic">
      <p id="direccion"></p>
      <a class="btn" data-mapa target="_blank" rel="noopener"><svg class="i"><use href="#i-pin"/></svg>Abrir en Google Maps</a>
    </div>
  </section>

  <div class="cierre">
    <h2>Tu cita, a un mensaje</h2>
    <p>Escríbenos por WhatsApp y te ayudamos a elegir tu servicio.</p>
    <a class="btn" data-wa><svg class="i"><use href="#i-wa"/></svg>Agendar cita</a>
  </div>
</main>

<footer><div class="wrap" id="pie"></div></footer>

<div class="barra" id="barra"><a class="btn" data-wa><svg class="i"><use href="#i-wa"/></svg>Agendar por WhatsApp</a></div>
<div class="toast" id="toast" hidden role="status"></div>
<dialog id="visor"><img id="visor-img" alt=""><button type="button" id="cerrar">Cerrar</button></dialog>

<script src="config.js"></script>
<script>
(function(){
  var C = CONFIG, K = C.contacto, N = C.negocio, $ = function(s){return document.querySelector(s)};
  var pendientes = [];
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
  function digitos(s){return String(s||"").replace(/\D/g,"")}
  function toast(t){var e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},3200)}
  function marcar(el,url,faltante){
    if(url){el.href=url;return}
    el.href="#";
    if(pendientes.indexOf(faltante)<0)pendientes.push(faltante);
    el.addEventListener("click",function(ev){ev.preventDefault();toast("PENDIENTE DE CONFIGURAR: "+faltante)});
  }
  function urlWA(texto){var n=digitos(K.whatsapp);return n?"https://wa.me/"+n+"?text="+encodeURIComponent(texto||C.mensajeWhatsApp):""}
  function red(v,base){if(!v)return "";return /^https?:\/\//i.test(v)?v:base+String(v).replace(/^@/,"")}

  document.title = N.nombre + " · " + (N.ciudad||"");
  $("#nombre").textContent = N.nombre;
  $("#frase").textContent = N.frase;
  $("#ciudad").textContent = N.ciudad||"";
  $("#pie").textContent = "© " + new Date().getFullYear() + " " + N.nombre;

  if(N.logo){
    $("#marca").innerHTML='<img src="'+esc(N.logo)+'" alt="Logotipo de '+esc(N.nombre)+'" fetchpriority="high">';
    $("#nombre").className="sr";
  }else{pendientes.push("logotipo")}

  document.querySelectorAll("[data-wa]").forEach(function(a){marcar(a,urlWA(),"número de WhatsApp")});
  marcar($("#llamar"), digitos(K.telefono)?"tel:+"+digitos(K.telefono):"", "teléfono");
  marcar($("#instagram"), red(K.instagram,"https://instagram.com/"), "Instagram");
  marcar($("#facebook"), K.facebook, "Facebook");
  var mapa = K.mapsUrl || (K.direccion ? "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(K.direccion) : "");
  document.querySelectorAll("[data-mapa]").forEach(function(a){marcar(a,mapa,"dirección")});
  $("#direccion").textContent = K.direccion || "PENDIENTE DE CONFIGURAR: dirección del salón";

  $("#compartir").addEventListener("click",function(){
    var d={title:N.nombre,text:N.frase,url:location.href};
    if(navigator.share){navigator.share(d).catch(function(){})}
    else if(navigator.clipboard){navigator.clipboard.writeText(d.url).then(function(){toast("Enlace copiado")},function(){toast(d.url)})}
    else{toast(d.url)}
  });

  var ls = C.servicios||[];
  $("#lista-servicios").innerHTML = ls.map(function(s,i){
    return '<a class="sv" data-s="'+i+'">'+(s.foto?'<img loading="lazy" decoding="async" src="'+esc(s.foto)+'" alt="'+esc(s.nombre)+'">':'')
      +'<div class="in"><div class="top"><h3>'+esc(s.nombre)+'</h3>'
      +(s.precio?'<span class="pr">'+esc(s.precio)+'</span>':'<span class="pr sin">Consultar</span>')+'</div>'
      +(s.descripcion?'<p>'+esc(s.descripcion)+'</p>':'')
      +'<span class="go">Consultar por WhatsApp ›</span></div></a>';
  }).join("");
  document.querySelectorAll("[data-s]").forEach(function(a){
    var s=ls[a.getAttribute("data-s")];
    marcar(a,urlWA("Hola, me interesa el servicio de "+s.nombre+". ¿Me pueden dar información y agendar una cita? 😊"),"número de WhatsApp");
  });

  var gs = C.galeria||[];
  if(gs.length){
    $("#galeria").hidden=false;
    $("#lista-galeria").innerHTML = gs.map(function(f,i){return '<button class="g" type="button" data-g="'+i+'" aria-label="Ver foto '+(i+1)+'"><img loading="lazy" decoding="async" src="'+esc(f)+'" alt="Trabajo realizado en '+esc(N.nombre)+'"></button>'}).join("");
    var v=$("#visor");
    document.querySelectorAll("[data-g]").forEach(function(b){b.addEventListener("click",function(){$("#visor-img").src=gs[b.getAttribute("data-g")];v.showModal()})});
    $("#cerrar").addEventListener("click",function(){v.close()});
    v.addEventListener("click",function(e){if(e.target===v)v.close()});
  }else{pendientes.push("fotos de la galería")}

  var barra=$("#barra");
  if("IntersectionObserver" in window){
    new IntersectionObserver(function(e){barra.classList.toggle("ver",!e[0].isIntersecting)}).observe($("#cta"));
  }else{barra.classList.add("ver")}

  if(C.mostrarAvisos && pendientes.length){
    var a=$("#aviso");
    a.innerHTML='<span>PENDIENTE DE CONFIGURAR: '+esc(pendientes.join(", "))+'.</span><button type="button">Ocultar</button>';
    a.hidden=false;
    a.querySelector("button").addEventListener("click",function(){a.hidden=true});
  }
})();
</script>
</body>
</html>
