<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yalith Salón · Cancún</title>
<meta name="description" content="Uñas y pestañas en Cancún. Agenda tu cita por WhatsApp.">
<meta name="theme-color" content="#0D0A0B">
<!-- Vista previa al compartir en WhatsApp/Facebook. PENDIENTE: pon aquí tu enlace real y tu imagen (ver LEEME.md, paso 5) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Yalith Salón · Cancún">
<meta property="og:description" content="Uñas y pestañas en Cancún. Agenda tu cita por WhatsApp.">
<meta property="og:locale" content="es_MX">
<!-- <meta property="og:url" content="PENDIENTE DE CONFIGURAR"> -->
<!-- <meta property="og:image" content="PENDIENTE DE CONFIGURAR"> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--negro:#0D0A0B;--carbon:#1A1315;--carbon2:#261A1E;--rosa:#F2B8C6;--rosa-suave:#F7D3DB;--oro:#C9A24D;--oro-claro:#E8C77A;--texto:#F6E9E4;--suave:#CDB7B1;--linea:rgba(201,162,77,.45)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Jost,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--negro);color:var(--texto);line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;line-height:1.08}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--oro-claro);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.aviso{background:var(--rosa);color:var(--negro);font-size:.85rem;padding:10px 16px;display:flex;gap:12px;align-items:flex-start}
.aviso button{margin-left:auto;background:none;border:1px solid var(--negro);color:var(--negro);border-radius:999px;padding:2px 12px;font:inherit;cursor:pointer}

.hero{background:var(--negro);padding:44px 0 40px;text-align:center;border-bottom:1px solid var(--linea)}
.arco[hidden]{display:none}
.arco{width:min(72%,290px);aspect-ratio:3/4;margin:0 auto 38px;border-radius:999px 999px 20px 20px;outline:1px solid var(--oro);outline-offset:9px;overflow:hidden;background:var(--carbon2);display:grid;place-items:center;animation:aparece .9s ease both}
.arco img{width:100%;height:100%;object-fit:cover}
.mono{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:6rem;color:var(--oro)}
.logo{width:100%;max-width:440px;aspect-ratio:3/2;object-fit:cover;border-radius:26px;margin:0 auto 26px;border:1px solid var(--oro);box-shadow:0 0 36px rgba(201,162,77,.25)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero h1{font-size:clamp(2.7rem,13vw,3.8rem);font-style:italic;color:var(--rosa)}
.frase{color:var(--rosa-suave);margin:10px auto 0;max-width:30ch;font-size:1.05rem}
.ciudad{color:var(--oro-claro);font-size:.95rem;margin-top:6px}
@keyframes aparece{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px 22px;border-radius:999px;background:linear-gradient(135deg,#EBCB84,#C9A24D);color:var(--negro);font-weight:600;font-size:1.05rem;border:0;cursor:pointer;font-family:inherit;box-shadow:0 6px 22px rgba(201,162,77,.3)}
.btn:active{transform:translateY(1px)}
.hero .btn{margin-top:26px}

.rapidos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:22px 0 4px}
.q{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;background:var(--carbon);border:1px solid var(--linea);border-radius:18px;font-size:.88rem;color:var(--texto);cursor:pointer;font-family:inherit}
.q svg{color:var(--oro-claro)}

section{padding:46px 0 6px}
h2{font-size:2.1rem;margin-bottom:6px;color:var(--rosa)}
.sub{color:var(--suave);margin-bottom:22px}

.serv{background:var(--carbon);border-radius:26px 26px 18px 18px;overflow:hidden;margin-bottom:18px;border:1px solid var(--linea)}
.serv .foto{aspect-ratio:16/10;background:var(--carbon2);display:grid;place-items:center;color:var(--suave);font-size:.9rem}
.serv .foto img{width:100%;height:100%;object-fit:cover}
.serv .cuerpo{padding:16px 18px 18px}
.serv h3{font-size:1.7rem;color:var(--texto)}
.serv p{color:var(--suave);margin-top:4px}
.fila{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.precio{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.6rem;color:var(--oro-claro)}
.mini{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:1.5px solid var(--rosa);font-weight:500;color:var(--rosa);margin-left:auto}

.galeria{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:120px;gap:8px}
.g{border:0;padding:0;border-radius:16px;overflow:hidden;background:var(--carbon2);cursor:pointer;color:var(--suave);font:inherit;font-size:.85rem}
.g:nth-child(3n+1){grid-row:span 2}
.g img{width:100%;height:100%;object-fit:cover}
dialog{border:0;background:transparent;max-width:96vw;max-height:92vh;padding:0}
dialog::backdrop{background:rgba(0,0,0,.9)}
dialog img{max-height:86vh;border-radius:14px;margin:auto}
dialog button{display:block;margin:10px auto 0;background:var(--carbon);color:var(--texto);border:1px solid var(--linea);border-radius:999px;padding:8px 22px;font:inherit;cursor:pointer}

.ubic{background:var(--carbon);border-radius:22px;padding:22px;border:1px solid var(--linea)}
.ubic p{margin-bottom:16px}
footer{text-align:center;color:var(--suave);font-size:.85rem;padding:40px 0 10px}

.barra{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(13,10,11,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--linea);z-index:5}
.barra .btn{max-width:528px;margin:0 auto}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--rosa);color:var(--negro);padding:10px 18px;border-radius:999px;font-size:.9rem;z-index:9;max-width:90vw;text-align:center}
.toast[hidden]{display:none}
@media(min-width:700px){.wrap{max-width:620px}.galeria{grid-auto-rows:150px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="aviso" class="aviso" hidden></div>

<header class="hero">
  <div class="wrap">
    <div class="arco" id="arco"></div>
    <div id="marca"></div>
    <h1 id="nombre"></h1>
    <p class="frase" id="frase"></p>
    <p class="ciudad" id="ciudad"></p>
    <a class="btn" data-wa data-pos="portada"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>Agendar cita</a>
  </div>
</header>

<main class="wrap">
  <nav class="rapidos" aria-label="Contacto rápido">
    <a class="q" data-wa><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>WhatsApp</a>
    <a class="q" id="llamar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>Llamar</a>
    <a class="q" id="instagram" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></svg>Instagram</a>
    <a class="q" id="facebook" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>Facebook</a>
    <a class="q" data-mapa target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>Ubicación</a>
    <button class="q" id="compartir" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>Compartir</button>
  </nav>

  <section id="servicios" aria-labelledby="t-serv">
    <h2 id="t-serv">Nuestros servicios</h2>
    <p class="sub">Elige el que te interesa y escríbenos: respondemos por WhatsApp.</p>
    <div id="lista-servicios"></div>
  </section>

  <section id="galeria" aria-labelledby="t-gal">
    <h2 id="t-gal">Galería</h2>
    <p class="sub">Trabajos reales hechos en el salón.</p>
    <div class="galeria" id="lista-galeria"></div>
  </section>

  <section id="ubicacion" aria-labelledby="t-ubi">
    <h2 id="t-ubi">Ubicación</h2>
    <div class="ubic">
      <p id="direccion"></p>
      <a class="btn" data-mapa target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>Abrir en Google Maps</a>
    </div>
  </section>
</main>

<footer><div class="wrap" id="pie"></div></footer>

<div class="barra"><a class="btn" data-wa data-pos="barra"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>Agendar por WhatsApp</a></div>
<div class="toast" id="toast" hidden role="status"></div>
<dialog id="visor"><img id="visor-img" alt=""><button type="button" id="cerrar">Cerrar</button></dialog>

<script src="config.js"></script>
<script>
(function(){
  var C = CONFIG, K = C.contacto, N = C.negocio, $ = function(s){return document.querySelector(s)};
  var pendientes = [];
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
  function digitos(s){return String(s||"").replace(/\D/g,"")}
  function toast(t){var e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},3200)}
  function marcar(el,url,faltante){
    if(url){el.href=url;return}
    el.href="#";
    if(pendientes.indexOf(faltante)<0)pendientes.push(faltante);
    el.addEventListener("click",function(ev){ev.preventDefault();toast("PENDIENTE DE CONFIGURAR: "+faltante)});
  }
  function urlWA(texto){var n=digitos(K.whatsapp);return n?"https://wa.me/"+n+"?text="+encodeURIComponent(texto||C.mensajeWhatsApp):""}
  function red(v,base){if(!v)return "";return /^https?:\/\//i.test(v)?v:base+String(v).replace(/^@/,"")}

  document.title = N.nombre + " · " + (N.ciudad||"");
  $("#nombre").textContent = N.nombre;
  $("#frase").textContent = N.frase;
  $("#ciudad").textContent = N.ciudad||"";
  $("#pie").textContent = "© " + new Date().getFullYear() + " " + N.nombre;

  if(N.logo){$("#marca").innerHTML='<img class="logo" src="'+esc(N.logo)+'" alt="Logotipo de '+esc(N.nombre)+'" fetchpriority="high">';$("#nombre").className="sr"}
  else if(pendientes.indexOf("logotipo")<0){pendientes.push("logotipo")}
  if(N.fotoPortada){$("#arco").innerHTML='<img src="'+esc(N.fotoPortada)+'" alt="'+esc(N.nombre)+'">'}
  else{$("#arco").hidden=true;pendientes.push("foto de portada")}

  document.querySelectorAll("[data-wa]").forEach(function(a){marcar(a,urlWA(),"número de WhatsApp")});
  marcar($("#llamar"), digitos(K.telefono)?"tel:+"+digitos(K.telefono):"", "teléfono");
  marcar($("#instagram"), red(K.instagram,"https://instagram.com/"), "Instagram");
  marcar($("#facebook"), K.facebook, "Facebook");
  var mapa = K.mapsUrl || (K.direccion ? "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(K.direccion) : "");
  document.querySelectorAll("[data-mapa]").forEach(function(a){marcar(a,mapa,"dirección")});
  $("#direccion").textContent = K.direccion || "PENDIENTE DE CONFIGURAR: dirección del salón";

  $("#compartir").addEventListener("click",function(){
    var d={title:N.nombre,text:N.frase,url:location.href};
    if(navigator.share){navigator.share(d).catch(function(){})}
    else if(navigator.clipboard){navigator.clipboard.writeText(d.url).then(function(){toast("Enlace copiado")},function(){toast(d.url)})}
    else{toast(d.url)}
  });

  var ls = C.servicios||[];
  $("#lista-servicios").innerHTML = ls.map(function(s,i){
    var msg="Hola, me interesa el servicio de "+s.nombre+". ¿Me pueden dar información y agendar una cita? 😊";
    return '<article class="serv"><div class="foto">'+(s.foto?'<img loading="lazy" decoding="async" src="'+esc(s.foto)+'" alt="'+esc(s.nombre)+'">':'Foto pendiente')+'</div>'
      +'<div class="cuerpo"><h3>'+esc(s.nombre)+'</h3>'+(s.descripcion?'<p>'+esc(s.descripcion)+'</p>':'')
      +'<div class="fila">'+(s.precio?'<span class="precio">'+esc(s.precio)+'</span>':'')
      +'<a class="mini" data-s="'+i+'">Consultar</a></div></div></article>';
  }).join("");
  document.querySelectorAll("[data-s]").forEach(function(a){
    var s=ls[a.getAttribute("data-s")];
    marcar(a,urlWA("Hola, me interesa el servicio de "+s.nombre+". ¿Me pueden dar información y agendar una cita? 😊"),"número de WhatsApp");
  });

  var gs = C.galeria||[];
  if(gs.length){
    $("#lista-galeria").innerHTML = gs.map(function(f,i){return '<button class="g" type="button" data-g="'+i+'" aria-label="Ver foto '+(i+1)+'"><img loading="lazy" decoding="async" src="'+esc(f)+'" alt="Trabajo realizado en '+esc(N.nombre)+'"></button>'}).join("");
    var v=$("#visor");
    document.querySelectorAll("[data-g]").forEach(function(b){b.addEventListener("click",function(){$("#visor-img").src=gs[b.getAttribute("data-g")];v.showModal()})});
    $("#cerrar").addEventListener("click",function(){v.close()});
    v.addEventListener("click",function(e){if(e.target===v)v.close()});
  }else{
    $("#lista-galeria").innerHTML = [0,1,2,3,4,5].map(function(){return '<div class="g" style="display:grid;place-items:center">Foto pendiente</div>'}).join("");
    pendientes.push("fotos de la galería");
  }

  if(C.mostrarAvisos && pendientes.length){
    var a=$("#aviso");
    a.innerHTML='<span>PENDIENTE DE CONFIGURAR: '+esc(pendientes.join(", "))+'.</span><button type="button">Ocultar</button>';
    a.hidden=false;
    a.querySelector("button").addEventListener("click",function(){a.hidden=true});
  }
})();
</script>
</body>
</html>
